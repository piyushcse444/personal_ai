spring.application.name=personal-ai-backend
management.endpoints.web.exposure.include=health
spring.config.import=optional:file:../.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:personal_ai}}
spring.datasource.username=${DB_USERNAME:${POSTGRES_USER:personal_ai}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD:personal_ai_dev}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true
